<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YatraAI — Login & Sign Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ea580c;
            --secondary: #38bdf8;
            --bg: #121820;
            --text: #f4f4f5;
            --text-secondary: #a1a1aa;
            --glass-bg: rgba(28, 38, 52, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(rgba(18, 24, 32, 0.8), rgba(18, 24, 32, 0.8)), 
                        url("{{ url_for('static', filename='images/login_bg.png') }}") no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text);
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 400px;
            max-width: 90%;
            perspective: 1000px;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            padding: 2.5rem;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h1 {
            font-size: 2rem;
            font-weight: 900;
            font-style: italic;
            margin-bottom: 0.5rem;
        }

        .auth-header h1 span {
            color: var(--primary);
        }

        .auth-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 0.75rem;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s;
            color: var(--text-secondary);
        }

        .tab.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--glass-border);
            padding: 0.875rem 1rem;
            border-radius: 12px;
            color: white;
            font-size: 0.9375rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-input:focus {
            border-color: var(--secondary);
            background: rgba(0, 0, 0, 0.3);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.1);
        }

        .auth-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(234, 88, 12, 0.3);
            filter: brightness(1.1);
        }

        .auth-btn:active {
            transform: translateY(0);
        }

        .switch-msg {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
        }

        .switch-msg span {
            color: var(--secondary);
            cursor: pointer;
            font-weight: 600;
        }

        .hidden {
            display: none;
        }

        /* Micro-animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        form {
            animation: fadeIn 0.4s ease-out;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="auth-card">
            <header class="auth-header">
                <h1>YATRA<span>AI</span></h1>
                <p style="font-size: 0.75rem; color: var(--text-secondary); letter-spacing: 0.2em; text-transform: uppercase;">Location Intelligence</p>
            </header>

            <div class="auth-tabs">
                <div id="loginTab" class="tab active" onclick="toggleAuth('login')">Sign In</div>
                <div id="signupTab" class="tab" onclick="toggleAuth('signup')">Sign Up</div>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" class="form-input" placeholder="traveler@yatra.ai" required>
                </div>
                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Sign In to Scout</button>
                <p class="switch-msg">New here? <span onclick="toggleAuth('signup')">Create an account</span></p>
            </form>

            <form id="signupForm" class="hidden">
                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" class="form-input" placeholder="AdventureSeeker" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <input type="email" id="signupEmail" class="form-input" placeholder="traveler@yatra.ai" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="auth-btn">Join YatraAI</button>
                <p class="switch-msg">Already have an account? <span onclick="toggleAuth('login')">Sign in instead</span></p>
            </form>
        </div>
    </div>

    <script>
        function toggleAuth(type) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');

            if (type === 'signup') {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                loginTab.classList.remove('active');
                signupTab.classList.add('active');
            } else {
                signupForm.classList.add('hidden');
                loginForm.classList.remove('hidden');
                signupTab.classList.remove('active');
                loginTab.classList.add('active');
            }
        }
    </script>
</body>
</html>
